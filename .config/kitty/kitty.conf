# BEGIN_KITTY_THEME
# Rosé Pine (official main variant)
include rose-pine.conf
# END_KITTY_THEME



# BEGIN_KITTY_FONTS
font_family family='CaskaydiaMono Nerd Font Mono'
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 18
# END_KITTY_FONTS

# Background opacity
background_opacity 0.86
dynamic_background_opacity yes
background_blur 30
# Codex with Rosé Pine: translucent composer, unfilled submitted messages.
# Exact RGB matches; other applications using these colours are affected too.
transparent_background_colors #34323e@0.88 #3d3c47@0.0

mouse_hide_wait -3.0

cursor_shape block

shell_integration no-cursor
allow_remote_control socket-only
listen_on unix:@kitty

# Select Wayland in Plasma/Hyprland and X11 in i3.
linux_display_server auto

# Give the prompt and terminal content space inside the window border.
window_padding_width 4 10 10 10
