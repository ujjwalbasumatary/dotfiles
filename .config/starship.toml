# Compact Rosé Pine prompt: foreground colours only, no powerline blocks.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
[ · ](muted)\
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$conda\
$cmd_duration\
$line_break\
$character"""

palette = 'rose_pine'
add_newline = false

[os]
format = '[$symbol]($style) '
disabled = true
style = "fg:red"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "fg:red"
style_root = "fg:red"
format = '[$user]($style)'

[directory]
style = "fg:peach"
format = '[$path]($style) '
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:yellow"
format = '[$symbol $branch]($style) '

[git_status]
style = "fg:yellow"
format = '([$all_status$ahead_behind]($style) )'

[nodejs]
symbol = ""
style = "fg:green"
format = '[$symbol( $version)]($style) '

[bun]
symbol = ""
style = "fg:green"
format = '[$symbol( $version)]($style) '

[c]
symbol = ""
style = "fg:green"
format = '[$symbol( $version)]($style) '

[rust]
symbol = ""
style = "fg:green"
format = '[$symbol( $version)]($style) '

[golang]
symbol = ""
style = "fg:green"
format = '[$symbol( $version)]($style) '

[php]
symbol = ""
style = "fg:green"
format = '[$symbol( $version)]($style) '

[java]
symbol = ""
style = "fg:green"
format = '[$symbol( $version)]($style) '

[kotlin]
symbol = ""
style = "fg:green"
format = '[$symbol( $version)]($style) '

[haskell]
symbol = ""
style = "fg:green"
format = '[$symbol( $version)]($style) '

[python]
symbol = ""
style = "fg:green"
format = '[$symbol( $version)( \($virtualenv\))]($style) '

[docker_context]
symbol = ""
style = "fg:sapphire"
format = '[$symbol $context]($style) '

[conda]
symbol = ' '
style = "fg:sapphire"
format = '[$symbol$environment]($style) '
ignore_base = false

[time]
disabled = true
time_format = "%R"
style = "fg:lavender"
format = '[· ](muted)[$time]($style) '

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](fg:green)'
error_symbol = '[❯](fg:red)'
vimcmd_symbol = '[❮](fg:green)'
vimcmd_replace_one_symbol = '[❮](fg:lavender)'
vimcmd_replace_symbol = '[❮](fg:lavender)'
vimcmd_visual_symbol = '[❮](fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = '[· ](muted)[$duration]($style) '
style = "fg:subtle"
disabled = false
show_notifications = false
min_time_to_notify = 45000

