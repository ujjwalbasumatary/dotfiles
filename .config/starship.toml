# Official Rosé Pine main colours, mapped onto the existing prompt's aliases.
# Foreground accents for the compact prompt; no filled background segments.
# Palette source: https://github.com/rose-pine/starship/blob/main/rose-pine.toml
[palettes.rose_pine]
subtle = "#908caa"
muted = "#6e6a86"
red = "#eb6f92"       # love
peach = "#ebbcba"     # rose
yellow = "#f6c177"    # gold
green = "#9ccfd8"     # foam
sapphire = "#ebbcba"  # rose
lavender = "#c4a7e7"  # iris
crust = "#191724"     # base

# Rosé Pine roles used for the lightweight separators and duration text.
