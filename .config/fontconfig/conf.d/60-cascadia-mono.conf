<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Primary coding font, with Julia's broad mathematical coverage available. -->
  <alias>
    <family>monospace</family>
    <prefer><family>CaskaydiaMono Nerd Font Mono</family><family>JuliaMono</family></prefer>
  </alias>
  <match target="pattern">
    <test name="family" compare="contains"><string>CaskaydiaMono</string></test>
    <edit name="family" mode="append" binding="weak"><string>JuliaMono</string></edit>
  </match>
</fontconfig>
