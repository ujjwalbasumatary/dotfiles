; Icon spacing: 24px monospace glyphs + 8px gap; modules separated by 18px.
; Kanagawa Wave: match Kitty colours and Cascadia Mono typography. Start with ~/.config/polybar/launch.sh.
[colors]
background = #1F1F28
surface = #2D4F67
foreground = #DCD7BA
muted = #727169
accent = #C0A36E
warning = #E6C384
urgent = #C34043

[bar/bar1]
monitor = ${env:MONITOR:}
monitor-strict = true
width = 100%
height = 36px
bottom = false
radius = 0
dpi = 96
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2px
border-bottom-size = 0
border-bottom-color = ${colors.surface}
padding-left = 12px
padding-right = 12px
module-margin-left = 0px
module-margin-right = 18px
font-0 = CaskaydiaMono Nerd Font Mono:size=12;2
font-1 = Weather Icons:size=10;2
font-2 = CaskaydiaMono Nerd Font Mono:pixelsize=24;2
modules-left = launcher i3 xwindow
modules-center =
modules-right = ${env:POLYBAR_MODULES_RIGHT:pulseaudio wlan ethernet battery tray date lock}
fixed-center = true
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

[module/launcher]
type = custom/text
format = <label>
label = 
label-font = 3
label-foreground = ${colors.accent}
label-padding = 0px
click-left = rofi -no-config -show drun -show-icons -icon-theme Papirus-Dark -theme ~/.config/i3/rofi.rasi

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-click = true
enable-scroll = false
format = <label-state> <label-mode>
label-focused = %index%
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.background}
label-focused-underline = ${colors.accent}
label-focused-padding = 1
label-unfocused = %index%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 1
label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1
label-urgent = %index%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 1
label-mode = %mode%
label-mode-background = ${colors.accent}
label-mode-foreground = ${colors.background}
label-mode-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:40:…%
label-foreground = ${colors.muted}

[module/date]
type = internal/date
interval = 1
date = %a %d %b  ·  %H:%M
date-alt = %Y-%m-%d  %H:%M:%S
format-prefix = ""
format-prefix-padding-right = 8px
format-prefix-font = 3
format-prefix-foreground = ${colors.accent}
label = %date%

[module/weather]
type = custom/script
exec = ~/.config/polybar/scripts/weather.sh
interval = 600
label = %output%
label-font = 2
label-foreground = ${colors.muted}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <label-volume>
format-volume-prefix = ""
format-volume-prefix-padding-right = 8px
format-volume-prefix-font = 3
format-volume-prefix-foreground = ${colors.accent}
label-volume = %percentage%%
format-muted = <label-muted>
format-muted-prefix = ""
format-muted-prefix-padding-right = 8px
format-muted-prefix-font = 3
format-muted-prefix-foreground = ${colors.muted}
label-muted = muted
label-muted-foreground = ${colors.muted}
click-right = pavucontrol

[module/memory]
type = internal/memory
interval = 5
format-prefix = ""
format-prefix-padding-right = 8px
format-prefix-foreground = ${colors.muted}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 5
format-prefix = ""
format-prefix-padding-right = 8px
format-prefix-foreground = ${colors.muted}
label = %percentage:2%%

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <label-connected>
format-connected-prefix = ""
format-connected-prefix-padding-right = 8px
format-connected-prefix-font = 3
format-connected-prefix-foreground = ${colors.accent}
label-connected = %essid:0:12:…%
format-disconnected = <label-disconnected>
label-disconnected =

[module/ethernet]
type = internal/network
interface-type = wired
interval = 3
format-connected = <label-connected>
format-connected-prefix = "󰈀"
format-connected-prefix-padding-right = 8px
format-connected-prefix-font = 3
format-connected-prefix-foreground = ${colors.accent}
label-connected = LAN
format-disconnected = <label-disconnected>
label-disconnected =

[module/battery]
type = internal/battery
battery = ${env:POLYBAR_BATTERY:BAT1}
adapter = ${env:POLYBAR_ADAPTER:ACAD}
full-at = 99
low-at = 15
poll-interval = 5
format-charging = <label-charging>
format-charging-prefix = ""
format-charging-prefix-padding-right = 8px
format-charging-prefix-font = 3
format-charging-prefix-foreground = ${colors.accent}
label-charging = %percentage%%
format-discharging = <ramp-capacity><label-discharging>
label-discharging = %percentage%%
format-full = <ramp-capacity><label-full>
label-full = %percentage%%
label-full-foreground = ${colors.foreground}
format-low = <label-low>
format-low-prefix = ""
format-low-prefix-padding-right = 8px
format-low-prefix-font = 3
format-low-prefix-foreground = ${colors.urgent}
label-low = %percentage%% !
label-low-foreground = ${colors.urgent}
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.accent}
ramp-capacity-font = 3
ramp-capacity-padding-right = 8px

[module/tray]
type = internal/tray
tray-size = 18px
tray-spacing = 8px
format-margin = 0

[module/lock]
type = custom/text
format = <label>
label = 
label-font = 3
label-foreground = ${colors.muted}
click-left = i3lock --image /home/ujjwal/Pictures/astronaut.png

[settings]
screenchange-reload = true
pseudo-transparency = false
