# Used only by ~/.config/i3/compositor.sh. Plasma uses KWin.
backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;
use-ewmh-active-win = true;
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -7;
shadow-offset-y = -7;
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;
corner-radius = 6;
frame-opacity = 1.0;
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = false;
rules = (
  { match = "class_g = 'kitty'"; blur-background = true; },
  { match = "window_type = 'dock' || window_type = 'desktop'";
    shadow = false; corner-radius = 0; fade = false; },
  { match = "fullscreen"; shadow = false; corner-radius = 0; },
  { match = "class_g = 'i3lock' || class_g = 'slop'";
    shadow = false; corner-radius = 0; fade = false; }
);
