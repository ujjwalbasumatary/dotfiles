animations {
    enabled = false
}
background {
    monitor =
    path = /home/ujjwal/Pictures/evening-sky.png
    color = rgb(191724)
    blur_passes = 2
    blur_size = 4
    brightness = 0.55
}
label {
    monitor =
    text = $USER
    color = rgb(e0def4)
    font_size = 28
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 90
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 360, 64
    outline_thickness = 2
    outer_color = rgb(908caa)
    inner_color = rgb(1f1d2e)
    font_color = rgb(e0def4)
    font_family = JetBrainsMono Nerd Font Mono
    placeholder_text =   Password
    fail_color = rgb(eb6f92)
    check_color = rgb(f6c177)
    rounding = 0
    fade_on_empty = false
    position = 0, 0
    halign = center
    valign = center
}

# Large clock, date and cached local weather above the sign-in field.
label {
    monitor =
    text = $TIME
    color = rgb(e0def4)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 310
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgb(908caa)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 225
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:300000] /home/ujjwal/.config/hypr/scripts/weather --plain
    color = rgb(9ccfd8)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 170
    halign = center
    valign = center
}
