source = /home/ujjwal/.config/desktop-themes/current/hyprlock-colors.conf

animations {
    enabled = false
}
background {
    monitor =
    path = /home/ujjwal/Pictures/evening-sky.png
    color = $desktop_background
    blur_passes = 2
    blur_size = 4
    brightness = 0.55
}
label {
    monitor =
    text = $USER
    color = $desktop_text
    font_size = 28
    font_family = CaskaydiaMono Nerd Font Mono
    position = 0, 90
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    outer_color = $desktop_input_border
    inner_color = $desktop_input_fill
    font_color = $desktop_input_text
    font_family = CaskaydiaMono Nerd Font Mono
    placeholder_text = Password
    dots_text_format = *
    dots_size = 0.4
    dots_spacing = 0.3
    fail_color = $desktop_fail
    check_color = $desktop_check
    rounding = 0
    fade_on_empty = false
    position = 0, 0
    halign = center
    valign = center
}

# Large clock, date and cached local weather above the sign-in field.
label {
    monitor =
    text = $TIME
    color = $desktop_text
    font_size = 72
    font_family = CaskaydiaMono Nerd Font Mono
    position = 0, 310
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = $desktop_subtle
    font_size = 18
    font_family = CaskaydiaMono Nerd Font Mono
    position = 0, 250
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:300000] /home/ujjwal/.config/hypr/scripts/weather --plain
    color = $desktop_weather
    font_size = 18
    font_family = CaskaydiaMono Nerd Font Mono
    position = 0, 150
    halign = center
    valign = center
}

# The weather helper primes this cache link; reload reads cached data without networking.
image {
    monitor =
    path = /home/ujjwal/.cache/desktop-weather/current-icon.png
    size = 32
    rounding = 0
    border_size = 0
    reload_time = 60
    reload_cmd = /home/ujjwal/.config/hypr/scripts/weather --icon --cached
    position = 0, 195
    halign = center
    valign = center
}
